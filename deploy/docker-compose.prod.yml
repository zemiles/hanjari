name: hanjari

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api
  restart: unless-stopped
  stop_grace_period: 30s
  environment:
    DB_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-hanjari}
    POSTGRES_USER: ${POSTGRES_USER:-hanjari}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    REDIS_HOST: redis
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *default-logging

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?.env에 DOMAIN을 설정하세요}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging

  api-blue:
    <<: *api
    image: ghcr.io/zemiles/hanjari-api:${API_BLUE_TAG:-latest}
    ports:
      - "127.0.0.1:8081:8080"

  api-green:
    <<: *api
    image: ghcr.io/zemiles/hanjari-api:${API_GREEN_TAG:-latest}
    ports:
      - "127.0.0.1:8082:8080"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hanjari}
      POSTGRES_USER: ${POSTGRES_USER:-hanjari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:8.2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.20.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env에 GRAFANA_ADMIN_PASSWORD를 설정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
