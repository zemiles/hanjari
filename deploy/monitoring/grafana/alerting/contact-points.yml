# Slack 연락처 (파일 프로비저닝)
# - webhook URL은 저장소에 두지 않는다. 서버 .env의 SLACK_WEBHOOK_URL → compose가 Grafana 환경 변수로 넘긴다.
# - uid는 기존에 UI로 만든 연락처와 같게 둬서 새로 만들지 않고 이어받는다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: cg1lraubhtou8b
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
        disableResolveMessage: false
