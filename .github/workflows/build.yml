name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar

      - name: Upload api jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: api-jar
          path: api/build/libs/hanjari-api.jar
          retention-days: 1

  image:
    name: Build and push image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/zemiles/hanjari-api
    steps:
      - uses: actions/checkout@v6

      - name: Download api jar
        uses: actions/download-artifact@v8
        with:
          name: api-jar
          path: api/build/libs

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            api
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to production
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hanjari.duckdns.org/actuator/health
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp deploy/docker-compose.prod.yml "$TARGET:hanjari/compose.yml"
          scp deploy/Caddyfile "$TARGET:hanjari/Caddyfile"

      - name: Deploy and health check
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" "bash -s -- $GITHUB_SHA" <<'EOF'
          set -euo pipefail
          TAG="$1"
          cd ~/hanjari
          sed -i '/^API_IMAGE_TAG=/d' .env
          echo "API_IMAGE_TAG=$TAG" >> .env
          docker compose pull api
          docker compose up -d --remove-orphans
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "배포 성공: $TAG"
              docker image prune -f
              exit 0
            fi
            sleep 2
          done
          echo "헬스체크 실패"
          docker compose logs --tail=100 api
          exit 1
          EOF
