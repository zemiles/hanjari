deploy:
  name: Deploy to production
  needs: image
  runs-on: ubuntu-latest
  environment:
    name: production
    url: https://hanjari.duckdns.org/actuator/health
  concurrency:
    group: production
    cancel-in-progress: false
  steps:
    - uses: actions/checkout@v6

    - name: Set up SSH
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

    - name: Copy deploy files
      env:
        TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      run: |
        scp deploy/docker-compose.prod.yml "$TARGET:hanjari/compose.yml"
        scp deploy/Caddyfile "$TARGET:hanjari/Caddyfile"

    - name: Deploy and health check
      env:
        TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      run: |
        ssh "$TARGET" "bash -s -- $GITHUB_SHA" <<'EOF'
        set -euo pipefail
        TAG="$1"
        cd ~/hanjari
        sed -i '/^API_IMAGE_TAG=/d' .env
        echo "API_IMAGE_TAG=$TAG" >> .env
        docker compose pull api
        docker compose up -d --remove-orphans
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
            echo "배포 성공: $TAG"
            docker image prune -f
            exit 0
          fi
          sleep 2
        done
        echo "헬스체크 실패"
        docker compose logs --tail=100 api
        exit 1
        EOF
