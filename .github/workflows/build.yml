name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar

      - name: Upload api jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: api-jar
          path: api/build/libs/hanjari-api.jar
          retention-days: 1

  image:
    name: Build and push image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/zemiles/hanjari-api
    steps:
      - uses: actions/checkout@v6

      - name: Download api jar
        uses: actions/download-artifact@v8
        with:
          name: api-jar
          path: api/build/libs

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            api
          push() {
            for attempt in 1 2 3; do
              docker push "$1" && return 0
              echo "push 실패 ($attempt/3), $((attempt * 15))초 후 재시도"
              sleep $((attempt * 15))
            done
            return 1
          }
          push "$IMAGE:$GITHUB_SHA"
          push "$IMAGE:latest"

  deploy:
    name: Deploy to production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://hanjari.duckdns.org/actuator/health
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp deploy/docker-compose.prod.yml "$TARGET:hanjari/compose.yml"
          scp deploy/deploy.sh "$TARGET:hanjari/deploy.sh"
          scp -r deploy/caddy deploy/monitoring "$TARGET:hanjari/"

      - name: Blue-Green deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: ssh "$TARGET" "bash hanjari/deploy.sh $GITHUB_SHA"

  notify:
    name: Notify Slack
    needs: [build, image, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL이 없어서 알림을 건너뜁니다."
            exit 0
          fi

          escape() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          RESULTS="$BUILD_RESULT $IMAGE_RESULT $DEPLOY_RESULT"
          if [[ "$RESULTS" == *failure* ]]; then
            STATUS=":x: *실패*"
          elif [[ "$RESULTS" == *cancelled* ]]; then
            STATUS=":white_circle: *취소됨*"
          elif [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS=":rocket: *배포 완료*"
          else
            STATUS=":white_check_mark: *CI 통과*"
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TITLE="PR: $(escape "$PR_TITLE")"
            LINK="$PR_URL"
          else
            TITLE="$(escape "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)")"
            LINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          TEXT="$STATUS · $GITHUB_REPOSITORY
          <$LINK|${GITHUB_SHA:0:7}> $TITLE ($GITHUB_ACTOR)
          빌드: $BUILD_RESULT · 이미지: $IMAGE_RESULT · 배포: $DEPLOY_RESULT
          <$RUN_URL|실행 로그 보기>"

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
